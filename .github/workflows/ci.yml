name: Validate application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WEBEX_CLIENT_ID: test-client
      WEBEX_CLIENT_SECRET: test-secret
      WEBEX_REDIRECT_URI: https://example.com/auth/callback
      WEBEX_ALLOWED_DOMAIN: bullfrog.net
      SESSION_SECRET: test-session-secret-for-ci-only
      INTAKE_WEBHOOK_SECRET: test-intake-secret-for-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Test application startup and authentication routing
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          with TestClient(app) as client:
              health = client.get("/api/health")
              assert health.status_code == 200
              root = client.get("/", follow_redirects=False)
              assert root.status_code == 303
              assert root.headers["location"] == "/login"
              login = client.get("/login")
              assert login.status_code == 200

              unauthorized = client.post("/api/intake/email", json={
                  "message_id": "ci-message-1", "subject": "CI project request"
              })
              assert unauthorized.status_code == 401

              received = client.post("/api/intake/email", headers={
                  "X-Intake-Secret": "test-intake-secret-for-ci-only"
              }, json={
                  "message_id": "ci-message-1", "subject": "CI project request",
                  "sender_email": "sales@example.com", "body": "Test request"
              })
              assert received.status_code == 201
              assert received.json()["status"] == "Pending"

              duplicate = client.post("/api/intake/email", headers={
                  "X-Intake-Secret": "test-intake-secret-for-ci-only"
              }, json={
                  "message_id": "ci-message-1", "subject": "CI project request"
              })
              assert duplicate.status_code == 200
          PY
